<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Test Quiz - Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

  <div class="container">
    <div class="text-end mb-2 text-muted">
      👋 Hoş geldin, <strong>{{ session['username'] }}</strong>
    </div>
    
    <div class="card shadow p-4 mx-auto" style="max-width: 700px;">
      <h2 class="mb-4 text-center">📝 Test Soruları</h2>
      <form method="POST">
        {% for q in questions %}
          <div class="mb-4">
            <label class="form-label"><strong>{{ loop.index }}. {{ q.q }}</strong></label>
            <input type="text" name="q{{ loop.index0 }}" class="form-control" required>
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-success w-100">Testi Bitir</button>
      </form>
    </div>
  </div>

  <footer class="text-muted mt-5 text-center">
    <hr>
    <p>Hazırlayan: <strong>Feyza Çelik</strong></p>
  </footer>

</body>
</html>
