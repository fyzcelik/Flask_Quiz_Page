<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Test Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column justify-content-center align-items-center" style="min-height: 100vh;">

  <div class="container text-center">
    <div class="card shadow p-4" style="max-width: 500px; margin: auto;">
      <h2 class="mb-4">🎓 Test Quiz'e Hoş Geldin!</h2>
      <form method="POST">
        <div class="mb-3">
          <input type="text" name="username" class="form-control" placeholder="Adınızı girin" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Teste Başla</button>
      </form>
    </div>
  </div>

  <footer class="text-muted mt-5 text-center">
    <hr>
    <p>Hazırlayan: <strong>Feyza Çelik</strong></p>
  </footer>

</body>
</html>
