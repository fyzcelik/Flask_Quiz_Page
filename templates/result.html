<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Test Quiz - Sonuç</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

  <div class="container">
    <div class="text-end mb-2 text-muted">
      👋 Hoş geldin, <strong>{{ session['username'] }}</strong>
    </div>

    <div class="card shadow p-5 text-center mx-auto" style="max-width: 600px;">
      <h2 class="mb-4 text-success">🏁 Test Sonuçları</h2>

      <p class="fs-5">🎯 <strong>Son Skorun:</strong> {{ user.last_score }}</p>
      <p class="fs-5">🏅 <strong>En Yüksek Skorun:</strong> {{ user.best_score }}</p>
      <p class="fs-5">🌍 <strong>Genel En Yüksek Skor:</strong> {{ top_score }}</p>

      <div class="mt-4">
        <a href="/quiz" class="btn btn-primary me-2">Tekrar Dene</a>
        <a href="/" class="btn btn-outline-secondary">Anasayfa</a>
      </div>
    </div>
  </div>

  <footer class="text-muted mt-5 text-center">
    <hr>
    <p>Hazırlayan: <strong>Feyza Çelik</strong></p>
  </footer>

</body>
</html>
